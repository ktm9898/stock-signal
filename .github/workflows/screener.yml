name: KOSPI 200 Stock Signal Screener

on:
  schedule:
    # 10:05 KST (01:05 UTC) Mon-Fri
    - cron: '5 1 * * 1-5'
    # 14:05 KST (05:05 UTC) Mon-Fri
    - cron: '5 5 * * 1-5'
    # 15:42 KST (06:42 UTC) Mon-Fri
    - cron: '42 6 * * 1-5'
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pykrx ta gspread oauth2client requests beautifulsoup4

      - name: Run Screener Engine
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
        run: |
          python screener.py
