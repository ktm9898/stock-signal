name: KOSPI 200 Stock Signal Screener

on:
  schedule:
    # 10:00 KST (01:00 UTC) Mon-Fri
    - cron: '0 1 * * 1-5'
    # 14:00 KST (05:00 UTC) Mon-Fri
    - cron: '0 5 * * 1-5'
    # 15:40 KST (06:40 UTC) Mon-Fri
    - cron: '40 6 * * 1-5'
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pykrx ta gspread oauth2client requests beautifulsoup4

      - name: Run Screener Engine
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
        run: |
          python screener.py
