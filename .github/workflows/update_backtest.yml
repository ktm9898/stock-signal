name: Update 5-Year Backtest Dataset

on:
  workflow_dispatch:
  schedule:
    # Every Friday at 16:30 KST (07:30 UTC)
    - cron: '30 7 * * 5'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pykrx ta requests beautifulsoup4

      - name: Run Incremental Backtest Data Updater
        run: |
          python update_backtest_data.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/history_*.json data/stocks_350.json
          if git diff --staged --quiet; then
            echo "No new data changes to commit."
          else
            git commit -m "chore(data): auto-update backtest dataset chunk [skip ci]"
            git push origin main
          fi
